name: CI

# Typecheck, test, and build the desktop app on every OS for every push and pull request.
on:
  push:
    branches: [main, github-actions]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Privacy scan (no keys, home paths or personal emails in what we publish)
        run: node scripts/privacy-scan.mjs

      - name: Unit and integration tests
        run: npm test

      - name: Build the desktop app bundle
        run: npm run desktop:build
